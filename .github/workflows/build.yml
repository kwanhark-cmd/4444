name: 빌드와 테스트

on:
  push:
    branches: [main, 'claude/**']
  pull_request:
  workflow_dispatch:

env:
  FLUTTER_VERSION: '3.47.9'

jobs:
  test:
    name: 검사·테스트·리눅스 빌드
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: 리눅스 빌드 도구
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev ninja-build clang cmake pkg-config liblzma-dev libsqlite3-dev libavformat-dev libavcodec-dev libavutil-dev libswscale-dev
      - run: flutter pub get
      - name: 형식 검사
        run: dart format --output=none --set-exit-if-changed --line-length 160 lib test
      - name: 코드 검사
        run: flutter analyze
      - name: 테스트
        run: flutter test
      - name: 리눅스 빌드
        run: flutter build linux --release
      - uses: actions/upload-artifact@v4
        with:
          name: 리눅스-앱
          path: build/linux/x64/release/bundle

  android:
    name: 안드로이드 APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: 안드로이드-APK
          path: build/app/outputs/flutter-apk/app-release.apk

  windows:
    name: 윈도우
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build windows --release
      - uses: actions/upload-artifact@v4
        with:
          name: 윈도우-앱
          path: build/windows/x64/runner/Release

  macos:
    name: 맥
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build macos --release
      - name: 앱 묶기
        run: cd build/macos/Build/Products/Release && ditto -c -k --keepParent *.app ../../../../../binugi-macos.zip
      - uses: actions/upload-artifact@v4
        with:
          name: 맥-앱
          path: binugi-macos.zip
