name: 빌드와 테스트

on:
  push:
    branches: [main, 'claude/**']
  pull_request:
  workflow_dispatch:

env:
  FLUTTER_VERSION: '3.47.9'

jobs:
  test:
    name: 검사·테스트·리눅스 빌드
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: 리눅스 빌드 도구
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev ninja-build clang cmake pkg-config liblzma-dev libsqlite3-dev libavformat-dev libavcodec-dev libavutil-dev libswscale-dev libsecret-1-dev libjpeg-dev
      - run: flutter pub get
      - name: 형식 검사
        run: dart format --output=none --set-exit-if-changed --line-length 160 lib test test_screens
      - name: 코드 검사
        run: flutter analyze
      - name: 테스트
        run: flutter test
      - name: 리눅스 빌드
        run: flutter build linux --release
      - name: 리눅스 묶기
        run: tar -czf binugi-linux.tar.gz -C build/linux/x64/release bundle
      - uses: actions/upload-artifact@v5
        with:
          name: 리눅스-앱
          path: binugi-linux.tar.gz

  android:
    name: 안드로이드 APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      # 서명 열쇠 없이 빌드 (빌드마다 임시 서명). 새 버전은 백업 → 예전 앱 지우기 → 새로 설치 → 되살리기.
      - name: APK 만들기 (가끔 내려받기 실패가 있어 한 번 더 시도)
        run: flutter build apk --release || (echo "다시 시도합니다" && sleep 30 && flutter build apk --release)
      - run: cp build/app/outputs/flutter-apk/app-release.apk binugi-android.apk
      - uses: actions/upload-artifact@v5
        with:
          name: 안드로이드-APK
          path: binugi-android.apk

  windows:
    name: 윈도우
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build windows --release
      - name: 설치 파일 만들기
        shell: pwsh
        run: |
          $ver = (Select-String -Path pubspec.yaml -Pattern '^version:\s*([0-9.]+)').Matches[0].Groups[1].Value
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress | Out-Null }
          & $iscc "/DAppVersion=$ver" installer\windows.iss
          if ($LASTEXITCODE -ne 0) { exit 1 }
      - uses: actions/upload-artifact@v5
        with:
          name: 윈도우-설치파일
          path: dist/binugi-windows-setup.exe

  macos:
    name: 맥
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build macos --release
      - name: 앱 묶기
        run: cd build/macos/Build/Products/Release && ditto -c -k --keepParent *.app ../../../../../binugi-macos.zip
      - uses: actions/upload-artifact@v5
        with:
          name: 맥-앱
          path: binugi-macos.zip

  release:
    name: 새 버전 올리기 (Releases)
    needs: [test, android, windows, macos]
    # main에 올라간 커밋 메시지에 "[배포]"가 있거나, 직접 실행(workflow_dispatch)했을 때만 새 버전을 올림
    if: github.ref == 'refs/heads/main' && (github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && contains(github.event.head_commit.message, '[배포]')))
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: 버전 읽기
        id: v
        run: |
          VER=$(grep -E '^version:' pubspec.yaml | sed -E 's/version:\s*([0-9.]+).*/\1/')
          echo "version=$VER" >> "$GITHUB_OUTPUT"
          # 맨 위: 설치 방법 (안드로이드 = 백업 먼저). 이미 설치된 앱의 새 버전 창에 이 글의 앞부분이 보여요.
          cp .github/release_notes_head.md notes.md
          # 그 아래: CHANGELOG.md에서 이 버전 부분만 뽑아 바뀐 점으로
          awk -v v="## $VER" '$0==v{f=1;next} /^## /{f=0} f' CHANGELOG.md >> notes.md
      - uses: actions/download-artifact@v5
        with:
          path: dist
          merge-multiple: true
      # 같은 버전이 이미 있으면 파일만 새로 바꿔 올림. 네 가지 설치 파일(안드로이드 APK 포함)이 모두 있어야 올림.
      - uses: softprops/action-gh-release@v2
        with:
          fail_on_unmatched_files: true
          tag_name: v${{ steps.v.outputs.version }}
          name: 비우기 비서 ${{ steps.v.outputs.version }}
          body_path: notes.md
          files: |
            dist/binugi-android.apk
            dist/binugi-windows-setup.exe
            dist/binugi-macos.zip
            dist/binugi-linux.tar.gz
